<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Fecha de Nacimiento por DNI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="card">
    <h1>🪪 Consulta de Fecha de Nacimiento</h1>
    <p class="subtitle">Ingresa el nombre completo para obtener la fecha de nacimiento.</p>

    <form method="post" action="/consultar">
      <div class="form-group">
        <label for="nombres">Nombres</label>
        <input
          type="text"
          id="nombres"
          name="nombres"
          placeholder="Ej: JUAN CARLOS"
          value="{{ nombres or '' }}"
          required
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="apellido_paterno">Apellido Paterno</label>
          <input
            type="text"
            id="apellido_paterno"
            name="apellido_paterno"
            placeholder="Ej: GARCIA"
            value="{{ apellido_paterno or '' }}"
            required
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="apellido_materno">Apellido Materno</label>
          <input
            type="text"
            id="apellido_materno"
            name="apellido_materno"
            placeholder="Ej: LOPEZ"
            value="{{ apellido_materno or '' }}"
            required
            autocomplete="off"
          />
        </div>
      </div>

      <button type="submit">Consultar</button>
    </form>

    {% if error %}
    <div class="result error">
      <span class="icon">⚠️</span>
      <p>{{ error }}</p>
    </div>
    {% endif %}

    {% if fecha_nacimiento %}
    <div class="result success">
      <span class="icon">🎂</span>
      <div>
        {% if nombre_completo %}
        <p class="result-name">{{ nombre_completo }}</p>
        {% endif %}
        <p class="result-label">Fecha de nacimiento</p>
        <p class="result-date">{{ fecha_nacimiento }}</p>
      </div>
    </div>
    {% endif %}
  </div>

</body>
</html>
